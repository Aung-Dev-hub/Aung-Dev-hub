name: GitHub Snake

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake
        run: |
          curl -o output/github-contribution-grid-snake.svg https://raw.githubusercontent.com/platane/snk/master/output/github-contribution-grid-snake.svg

      - name: Commit Snake
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg
          git commit -m "Update Snake"
          git push
